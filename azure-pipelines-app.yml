
trigger:
  branches:
    include:
      - master
  paths:
    include:
      - app/**
      - tests/**
      - Dockerfile
      - azure-pipelines-app.yml
pool:
  vmImage: ubuntu-latest

variables:
  ACR_NAME: shareqaepacr2026
  ACR_LOGIN_SERVER: shareqaepacr2026.azurecr.io
  IMAGE_NAME: aep-lab-app
  AKS_RESOURCE_GROUP: rg-aep-lab-aks
  AKS_CLUSTER_NAME: aks-aep-lab

stages:
  - stage: Test
    displayName: Application Tests
    jobs:
      - job: RunTests
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
            displayName: Setup Python

          - script: |
              python -m pip install --upgrade pip
              pip install -r app/requirements.txt
              python -m unittest discover -s tests -v
            displayName: Install dependencies and run tests

  - stage: BuildAndPush
    displayName: Build and Push Image
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: Build
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Build and Push to ACR
            inputs:
              azureSubscription: mi-aep-lab-pipeline
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr login --name "$(ACR_NAME)"
                docker build \
                  -t "$(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(Build.BuildId)" .
                docker push "$(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(Build.BuildId)"

  - stage: Deploy
    displayName: Deploy to AKS
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - job: DeployApp
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Deploy and Verify
            inputs:
              azureSubscription: mi-aep-lab-pipeline
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az aks get-credentials \
                  --resource-group "$(AKS_RESOURCE_GROUP)" \
                  --name "$(AKS_CLUSTER_NAME)" \
                  --admin \
                  --overwrite-existing

                kubectl set image deployment/aep-lab-app \
                  aep-lab-app="$(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(Build.BuildId)"

                kubectl rollout status deployment/aep-lab-app --timeout=180s

                kubectl get pods
                kubectl get services
