
trigger:
  branches:
    include:
      - master
  paths:
    include:
      - infra/**
      - azure-pipelines.yml

pool:
  vmImage: ubuntu-latest

variables:
  TERRAFORM_VERSION: '1.13.3'
  SERVICE_CONNECTION: 'mi-aep-lab-pipeline'
  TF_RESOURCE_GROUP: 'rg-aep-lab-tfstate'
  TF_STORAGE_ACCOUNT: 'shareqaepstate545536'
  TF_CONTAINER: 'tfstate'
  TF_STATE_KEY: 'lab-network.tfstate'

stages:

# Stage 1: Terraform Format, Validate and Plan
- stage: TerraformPlan
  displayName: Terraform Plan
  jobs:
  - job: Plan
    displayName: Validate and Generate Plan
    steps:
    - checkout: self

    - bash: |
        set -euo pipefail
        VERSION="$(TERRAFORM_VERSION)"
        curl -fsSLo terraform.zip \
          "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
        unzip -o terraform.zip -d terraform-bin
        sudo install terraform-bin/terraform /usr/local/bin/terraform
        terraform version
      displayName: Install Terraform

    - bash: |
        set -euo pipefail
        terraform fmt -check -recursive infra
      displayName: Check Terraform Formatting

    - bash: |
        set -euo pipefail
        terraform -chdir=infra/environments/lab init -backend=false -input=false
        terraform -chdir=infra/environments/lab validate
      displayName: Terraform Validate

    - task: AzureCLI@2
      displayName: Generate Terraform Plan
      inputs:
        azureSubscription: $(SERVICE_CONNECTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          cd infra/environments/lab

          az account show -o table
          SUBSCRIPTION_ID=$(az account show --query id -o tsv)

          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="resource_group_name=$(TF_RESOURCE_GROUP)" \
            -backend-config="storage_account_name=$(TF_STORAGE_ACCOUNT)" \
            -backend-config="container_name=$(TF_CONTAINER)" \
            -backend-config="key=$(TF_STATE_KEY)" \
            -backend-config="use_azuread_auth=true"

          mkdir -p "$(Build.ArtifactStagingDirectory)"

          terraform plan \
            -input=false \
            -lock-timeout=60s \
            -var="subscription_id=${SUBSCRIPTION_ID}" \
            -out="$(Build.ArtifactStagingDirectory)/tfplan"

          terraform show -no-color \
            "$(Build.ArtifactStagingDirectory)/tfplan" \
            > "$(Build.ArtifactStagingDirectory)/tfplan.txt"

    - task: PublishPipelineArtifact@1
      displayName: Publish Terraform Plan
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)
        artifact: terraform-plan
        publishLocation: pipeline

# Stage 2: Approval and Terraform Apply
- stage: TerraformApply
  displayName: Approval and Terraform Apply
  dependsOn: TerraformPlan
  condition: succeeded()
  jobs:
  - deployment: ApplyInfrastructure
    displayName: Apply Approved Terraform Plan
    environment: aep-lab-infra-approval
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - download: current
            artifact: terraform-plan

          - bash: |
              set -euo pipefail
              VERSION="$(TERRAFORM_VERSION)"
              curl -fsSLo terraform.zip \
                "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
              unzip -o terraform.zip -d terraform-bin
              sudo install terraform-bin/terraform /usr/local/bin/terraform
              terraform version
            displayName: Install Terraform

          - task: AzureCLI@2
            displayName: Apply Approved Terraform Plan
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                cd infra/environments/lab

                PLAN_FILE="$(Pipeline.Workspace)/terraform-plan/tfplan"

                if [ ! -f "$PLAN_FILE" ]; then
                  echo "ERROR: Saved Terraform plan not found."
                  exit 1
                fi

                terraform init \
                  -input=false \
                  -reconfigure \
                  -backend-config="resource_group_name=$(TF_RESOURCE_GROUP)" \
                  -backend-config="storage_account_name=$(TF_STORAGE_ACCOUNT)" \
                  -backend-config="container_name=$(TF_CONTAINER)" \
                  -backend-config="key=$(TF_STATE_KEY)" \
                  -backend-config="use_azuread_auth=true"

                echo "Applying the approved saved plan..."
                terraform apply \
                  -input=false \
                  -lock-timeout=60s \
                  "$PLAN_FILE"

                echo "Terraform Apply completed."

                echo "Verifying AKS cluster..."
                az aks show \
                  --resource-group rg-aep-lab-aks \
                  --name aks-aep-lab \
                  --query "{name:name,state:provisioningState}" \
                  --output table

                echo "Infrastructure verification completed."
