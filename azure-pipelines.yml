
trigger:
  - master

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - bash: |
      set -euo pipefail

      TERRAFORM_VERSION="1.12.2"

      curl -fsSLo terraform.zip \
        "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

      unzip -o terraform.zip -d terraform-bin
      sudo install terraform-bin/terraform /usr/local/bin/terraform

      terraform version
    displayName: 'Install Terraform'

  - bash: |
      set -euo pipefail
      terraform fmt -check -recursive infra
    displayName: 'Check Terraform formatting'

  - bash: |
      set -euo pipefail
      terraform -chdir=infra/environments/lab init -backend=false -input=false
      terraform -chdir=infra/environments/lab validate
    displayName: 'Initialize and validate Terraform'

  - task: AzureCLI@2
    displayName: 'Terraform Plan using remote state'
    inputs:
      azureSubscription: 'mi-aep-lab-pipeline'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        cd infra/environments/lab

        echo "Checking Azure authentication..."
        az account show --query "{subscription:name, id:id}" -o table

        SUBSCRIPTION_ID=$(az account show --query id -o tsv)

        echo "Checking Terraform state container access..."
        az storage blob list \
          --account-name shareqaepstate545536 \
          --container-name tfstate \
          --auth-mode login \
          --query "[].name" \
          -o table

        echo "Initializing Terraform with Azure remote state..."
        terraform init \
          -input=false \
          -reconfigure \
          -backend-config="resource_group_name=rg-aep-lab-tfstate" \
          -backend-config="storage_account_name=shareqaepstate545536" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=lab-network.tfstate" \
          -backend-config="use_azuread_auth=true"

        echo "Generating Terraform plan..."
        terraform plan \
          -input=false \
          -lock-timeout=60s \
          -var="subscription_id=${SUBSCRIPTION_ID}"
